<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pago | Shop Sports</title>

    <link rel="stylesheet" href="estilo.css">

</head>

<body>

<header>

    <h1>🏆 Shop Sports</h1>

    <nav>

        <ul>

            <li><a href="inicio.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="carrito.html">Carrito</a></li>
            <li><a href="perfil.html">Mi Perfil</a></li>
            <li><a href="login.html">Cerrar sesión</a></li>

        </ul>

    </nav>

</header>

<section class="pago">

    <h2>Finalizar Compra</h2>

    <form>

        <label>Nombre del titular</label>
        <input type="text" placeholder="Ingrese el nombre del titular" required>

        <label>Número de tarjeta</label>
        <input type="text" placeholder="1234 5678 9012 3456" required>

        <label>Fecha de vencimiento</label>
        <input type="month" required>

        <label>CVV</label>
        <input type="password" maxlength="3" placeholder="123" required>

        <label>Dirección de envío</label>
        <textarea rows="4" placeholder="Ingrese la dirección de entrega" required></textarea>

        <label>Método de pago</label>

        <select required>

            <option value="">Seleccione una opción</option>
            <option>Tarjeta Crédito</option>
            <option>Tarjeta Débito</option>
            <option>PSE</option>
            <option>Nequi</option>
            <option>Daviplata</option>

        </select>

        <button
        type="button"
        class="btnPagar"
        onclick="alert('¡Compra realizada con éxito!'); window.location.href='inicio.html';">

            Confirmar Pago

        </button>

    </form>

</section>

<footer>

<p>© 2026 Shop Sports - Todos los derechos reservados.</p>

</footer>

</body>

</html>
