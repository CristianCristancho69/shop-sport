<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | Shop Sports</title>

    <link rel="stylesheet" href="estilo.css">

</head>

<body>

<div class="recuperar">

    <img src="img/logo.png" class="logo">

    <h1>Shop Sports</h1>

    <h2>Recuperar contraseña</h2>

    <p class="mensaje">
        Ingresa el correo electrónico con el que te registraste.
    </p>

    <form>

        <label>Correo electrónico</label>

        <input type="email" required>

        <button type="button" class="btnEnviar"
        onclick="alert('Se ha enviado un enlace de recuperación a tu correo electrónico.')">

            Enviar enlace

        </button>

    </form>

    <a href="login.html">

        <button class="volver">

            Volver al Login

        </button>

    </a>

</div>

</body>

</html>
